<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/Style.css" />
    <link rel="icon" href="assets/logo.png">

    <title>Shakai Club | Login</title>
</head>

<body>

    <!-- hotbar do site -->

    <div class="top center">

        <div class="title">
            <a href="index.html">
                <button class="titlebut"></button>
            </a>
            <img class="icon big" src="assets/logo.png">
            <H1>SHAKAI CLUB</H1>
        </div>

    </div>

    <!-- site em si -->

    <div class="backimg pic1">
        <div class="cardlogin">
            <div class="loginfield">
                <h2>Login to an Account</h2>
                <input class="input_cadastro" id="inp_email" placeholder="Email">
                <div class="errolog" id="error_email"></div>
                <input class="input_cadastro" id="inp_passwrd" placeholder="Password" type="password">
                <div class="errolog" id="error_pswrd"></div>
                <div>
                    <button class="butPad" onclick="onc_login()">
                        <img class="icon" src="assets/login.png">Login
                    </button>
                </div>
                <div class="errolog" id="error_fields"></div>
                <div class="text">Does not have an account? Create one <a style="color: #29aa63;"
                        href="register.html">here</a></div>
            </div>
        </div>
    </div>
    <!-- footer do site  -->

    <div class="foot">
        <p>Copyright © 2025 SHAKAI CLUB. All rights reserved</p>
        <p>We do not condone street racing. Follow traffic rules at all times.</p>
    </div>

</body>
<script>

    function onc_login() {
        let email = inp_email.value;
        let passwrd = inp_passwrd.value;
        console.log(email)

        if (email.length > 45 || !email.includes("@") || !email.endsWith(".com") || email.length == 0) {
            error_email.innerHTML = `• Must be a valid email`
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", passwrd);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: passwrd
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Oh no! Something went wrong...");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

        function sumirMensagem() {
        error_fields.style.display = "none"
    }
</script>

</html>
