<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/Style.css" />
    <link rel="icon" href="assets/logo.png">

    <title>Shakai Club | Register</title>
</head>

<body>

    <!-- hotbar do site -->

    <div class="top">

        <div>
            <button class="butPad" id="but1" onclick="onc_exit()">
                <img class="icon" src="assets/help.png">Help
            </button>
        </div>

        <div class="title loginfix">
            <a href="index.html">
                <button class="titlebut"></button>
            </a>
            <img class="icon big" src="assets/logo.png">
            <H1>SHAKAI CLUB</H1>
        </div>

    </div>

    <!-- site em si -->

    <div class="backimg pic1">
        <div class="cardlogin">
            <div class="loginfield">
                <h2>Register an Account</h2>
                <input class="input_cadastro" id="inp_cadastro" placeholder="Nickname">
                <div class="errolog" id="error_nick"></div>
                <input class="input_cadastro" id="inp_email" placeholder="Email">
                <div class="errolog" id="error_email"></div>
                <input class="input_cadastro" id="inp_pass" placeholder="Password" type="password">
                <div class="errolog" id="error_pswrd"></div>
                <input class="input_cadastro" id="inp_confpass" placeholder="Confirm Password" type="password">
                <div class="errolog" id="error_confirm"></div>
                <div>
                    <button class="butPad" onclick="onc_register()">
                        <img class="icon" src="assets/reigster.png">Register
                    </button>
                </div>
                <div class="errolog" id="error_exists"></div>
                <div class="text">Already have an account? Login <a style="color: #29aa63;"href="login.html">here</a></div>
            </div>
        </div>
    </div>
    <!-- footer do site  -->

    <div class="foot">
        <p>Copyright © 2025 SHAKAI CLUB. All rights reserved</p>
        <p>We do not condone street racing. Follow traffic rules at all times.</p>
    </div>

</body>
<script>

    function onc_register() {
        let nick = inp_cadastro.value;
        let email = inp_email.value;
        let psswrd = inp_pass.value;
        let confirm = inp_confpass.value;

        let valid = true;

        if (email.length > 45 || !email.includes("@") || !email.endsWith(".com") || email.length === 0) {
            error_email.innerHTML = `• Email is not valid.`
            valid = false;
        }
        if (psswrd.length > 45 || psswrd.length < 5) {
            error_pswrd.innerHTML = `• Password is not valid`
            valid = false;
        }
        if (psswrd !== confirm) {
            error_confirm.innerHTML = `• Password does not match`;
            valid = false;
        }
        if (
            nick.length < 5 ||
            nick.length > 20 ||
            nick.length == 0 ||
            nick.includes(" ") ||
            nick.includes("<") ||
            nick.includes(">") ||
            nick.includes("!") ||
            nick.includes("?") ||
            nick.includes(",") ||
            nick.includes(".") ||
            nick.includes("/")
        ) {
            error_nick.innerHTML = `• Nickname not valid.`
            valid = false;
        }

        if (valid == true) {
            // Enviando o valor da nova input
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    // crie um atributo que recebe o valor recuperado aqui
                    // Agora vá para o arquivo routes/usuario.js
                    nomeServer: nick,
                    emailServer: email,
                    senhaServer: psswrd,
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {

                        error_exists.innerHTML =
                            "Your account was registered, Redirecting to Login...";

                        setTimeout(function () {
                            window.location = "login.html";
                        }, 1000); // apenas para exibir o loading

                        limparFormulario();
                    } else {
                        throw "Oh no! Something went wrong...";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

            return false;
        }
        validacoes = false;


    }
</script>

</html>
