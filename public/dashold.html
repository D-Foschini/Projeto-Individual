<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/Style.css" />
    <title>Document</title>
</head>

<body>
    
<div class="top">

    <div>
        <button class="butPad" id="but1" onclick="onc_exit()" > 
        <img class="icon"src="assets/exit.png">Sair
        </button>
    </div>

    <div>
        <button class="butPad"> 
        <img class="icon"src="assets/exit.png">Perfil
        </button>
    </div>

    <div>
        <button class="butPad"> 
        <img class="icon"src="assets/exit.png">Sair
        </button>
    </div>

</div>


<div class="card">
    <div class="dyno">
        <img src="assets/bmw3.jpg" alt="">
        <canvas id="myChart"></canvas>
    </div>
</div>

</body>
<script>

function onc_exit() {
}



const ctx = document.getElementById('myChart');

var tophp = 455;
var nome = '2021 BMW M3 Competition (G80)';

new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['1000', '1500', '2000', '2500', '3000', '3500','4000','4500','5000','5500','6000','6500','7000','7500','8000'],
        datasets: [{
            label: 'HorsePower [HP]',
            data: [45, 70, 120, 190, 245, 295, 335, 375, 410, 430, 450, tophp, 430, 380, 300],
            borderColor: 'rgba(255, 99, 132, 1)',
            backgroundColor: 'rgba(255, 99, 132, 0.5)',
            borderWidth: 3, 
            lineTension: 0.3,
            yAxisID: 'y'
        }, {
            label: 'Torque [FT-LB]',
            data: [240, 245, 315, 400, 430, 445, 440, 440, 430, 410, 395, 365, 325, 265, 200],
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
            borderWidth: 3, 
            lineTension: 0.3,
            yAxisID: 'y1'
        }]
    },
    options: {
        responsive: true,
        interaction: {
            mode: 'index',
            intersect: false,
        },
        stacked: false,
        plugins: {
            title: {
                display: true,
                text: nome
            }
        },
        scales: {
            y: {
                type: 'linear',
                display: true,
                position: 'left',
                title: {
                    display: true,
                    text: 'HorsePower [HP]',
                    color: 'rgba(255, 99, 132, 1)'
                },
                min: 0,
                max: tophp+200
            },
            y1: {
                type: 'linear',
                display: true,
                position: 'right',
                title: {
                    display: true,
                    text: 'Torque [FT-LB]',
                    color: 'rgba(54, 162, 235, 1)'
                },
                min: 0,
                max: tophp+200
            },
            x: {
                 title: {
                    display: true,
                    text: 'Engine Speed [RPM]'
                }
            }
        },
        elements: {
            point:{
                radius: 0
            }
        },
    }
});
</script>

</html>
